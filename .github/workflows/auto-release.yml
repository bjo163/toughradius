name: MWX-ISP Automatic Version and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag to republish after a failed release run
        required: false
        type: string

permissions:
  contents: write
  issues: read
  packages: write

concurrency:
  group: automatic-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump SemVer and generate changelog
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.prepare.outputs.release }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      release_sha: ${{ steps.prepare.outputs.release_sha }}
      make_latest: ${{ steps.prepare.outputs.make_latest }}
      tag_only: ${{ steps.prepare.outputs.tag_only }}
      previous_tag: ${{ steps.prepare.outputs.previous_tag }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version and changelog
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          git fetch --force --tags origin
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$REQUESTED_TAG" ]; then
            if ! git rev-parse --verify "refs/tags/${REQUESTED_TAG}^{commit}" >/dev/null 2>&1; then
              echo "Requested tag does not exist: $REQUESTED_TAG" >&2
              exit 1
            fi
            latest_tag=$(git describe --tags --match 'v*' --abbrev=0)
            if [ "$REQUESTED_TAG" != "$latest_tag" ]; then
              if gh release view "$REQUESTED_TAG" >/dev/null 2>&1; then
                echo "Only an unpublished historical tag may be backfilled; refusing to overwrite $REQUESTED_TAG because it is not the latest tag ($latest_tag)." >&2
                exit 1
              fi
              # Backfill a tag that was created by an earlier run but never
              # published. Do not move GitHub's latest-release pointer backward.
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            else
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            echo "release_sha=$(git rev-parse "${REQUESTED_TAG}^{commit}")" >> "$GITHUB_OUTPUT"
            previous_tag=$(git describe --tags --match 'v*' --abbrev=0 "${REQUESTED_TAG}^")
            echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
            echo "republish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -q '^make_latest=' "$GITHUB_OUTPUT"; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

          python3 scripts/release_automation.py --github-output "$GITHUB_OUTPUT"
          if ! grep -q '^release=true$' "$GITHUB_OUTPUT"; then
            # A previous run may have created the tag but failed before publishing.
            latest_tag=$(git describe --tags --match 'v*' --abbrev=0)
            if ! gh release view "$latest_tag" >/dev/null 2>&1; then
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "release_tag=$latest_tag" >> "$GITHUB_OUTPUT"
              echo "previous_tag=$(git describe --tags --match 'v*' --abbrev=0 "${latest_tag}^")" >> "$GITHUB_OUTPUT"
              echo "republish=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Commit changelog and create release tag
        id: release_commit
        if: steps.prepare.outputs.release == 'true' && steps.prepare.outputs.republish != 'true' && steps.prepare.outputs.tag_only != 'true'
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          git commit -m "chore(release): ${RELEASE_TAG}"
          git tag -a "$RELEASE_TAG" -m "MWX-ISP ${RELEASE_TAG}"
          git push origin HEAD:main
          git push origin "$RELEASE_TAG"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Recover a release tag after a partial branch push
        if: steps.prepare.outputs.release == 'true' && steps.prepare.outputs.tag_only == 'true'
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
        shell: bash
        run: |
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "MWX-ISP ${RELEASE_TAG}"
          git push origin "$RELEASE_TAG"

      - name: Sync release metadata onto the latest dev tip
        if: steps.prepare.outputs.release == 'true'
        continue-on-error: true
        env:
          RELEASE_COMMIT_SHA: ${{ steps.prepare.outputs.release_sha || steps.release_commit.outputs.release_sha }}
        run: python3 scripts/sync_release_to_dev.py "$RELEASE_COMMIT_SHA"

  container:
    name: Publish GHCR image
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      release_tag: ${{ needs.prepare.outputs.release_tag }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  binaries:
    name: Publish release assets
    needs: [prepare, container]
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/release-publish.yml
    with:
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      make_latest: ${{ needs.prepare.outputs.make_latest == 'true' }}
    secrets: inherit
    permissions:
      contents: write
      issues: read
