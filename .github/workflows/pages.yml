name: Deploy Pages (mdbook handbook)

# Publishes the bilingual mdBook handbook under docs-site/ to GitHub Pages.
#
# The repository's Pages source must be set to "GitHub Actions" (the REST API
# reports this as build_type: workflow). The handbook is served from the
# repository's default project Pages URL; no legacy custom domain is attached.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least-privilege scopes required by actions/deploy-pages (OIDC deployment).
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments. Let an in-progress publish finish so a half-built site
# is never served, while superseded queued runs are skipped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build handbook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin mdBook to the same version as the CI docs gate and local builds so a
      # build that passes there also passes here.
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: '0.5.3'

      - name: Build handbook
        run: mdbook build docs-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
