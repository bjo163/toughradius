name: MWX-ISP Windows Preview

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build testable Windows executables
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded admin UI
        working-directory: web
        run: |
          npm ci
          npm run type-check
          npm run build

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -o release/mwx-isp-windows-amd64.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o release/mwx-isp-demo-seed-windows-amd64.exe ./cmd/demo-seed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location services/mwx-control
          go build -trimpath -o ../../release/mwx-control-windows-amd64.exe .
          $controlBuildExit = $LASTEXITCODE
          Pop-Location
          if ($controlBuildExit -ne 0) { exit $controlBuildExit }
          Get-FileHash release/*.exe -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)"
          } | Set-Content release/SHA256SUMS.txt

      - name: Upload Windows preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mwx-isp-windows-amd64-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
