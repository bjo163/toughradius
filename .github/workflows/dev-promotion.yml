name: MWX-ISP Dev Promotion

on:
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dev-promotion
  cancel-in-progress: true

jobs:
  promote:
    name: Keep a dev to main review PR ready
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Open or update promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          git fetch origin main dev
          if [ "$(git rev-list --count origin/main..origin/dev)" -eq 0 ]; then
            echo "dev has no commits ahead of main; no promotion PR is needed."
            exit 0
          fi

          existing=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Promotion PR #${existing} already tracks dev → main."
            exit 0
          fi

          cat > "$RUNNER_TEMP/promotion-body.md" <<'BODY'
          ## Automated promotion

          This PR tracks the changes on `dev` for review and promotion to `main`.
          CI and the Windows preview build run on every push to `dev`.

          Review the changes and successful checks before merging.
          BODY
          gh pr create \
            --base main \
            --head dev \
            --title "chore: promote dev to main" \
            --body-file "$RUNNER_TEMP/promotion-body.md"
