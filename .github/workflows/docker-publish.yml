name: MWX-ISP Container Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      release_tag:
        description: SemVer tag created by the main-branch release workflow
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Resolve image tags
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_ref="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          version="${release_ref#v}"
          if [ -z "$version" ] || [ "$version" = "$release_ref" ]; then
            echo "Expected a v-prefixed release tag, got: $release_ref" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git fetch --force --tags origin
          latest_tag=$(git describe --tags --match 'v*' --abbrev=0 origin/main)
          if [ "$release_ref" = "$latest_tag" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish MWX-ISP image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/${{ github.repository_owner }}/mwx-isp:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.latest == 'true' && format('ghcr.io/{0}/mwx-isp:latest', github.repository_owner) || '' }}
          labels: |
            org.opencontainers.image.title=MWX-ISP
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize published image
        run: |
          {
            echo '## MWX-ISP container published'
            echo ''
            echo '- Image: `ghcr.io/${{ github.repository_owner }}/mwx-isp:${{ steps.version.outputs.version }}`'
            echo '- Digest: `${{ steps.image.outputs.digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"
