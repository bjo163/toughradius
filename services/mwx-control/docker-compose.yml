services:
  mwx-control:
    image: mwx-control:local
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MWX_CONTROL_HTTP_ADDR: 0.0.0.0:8080
      MWX_CONTROL_GOSSIP_ADDR: ${MWX_CONTROL_GOSSIP_ADDR:-0.0.0.0}
      MWX_CONTROL_GOSSIP_PORT: ${MWX_CONTROL_GOSSIP_PORT:-7946}
    ports:
      - "127.0.0.1:8080:8080/tcp"
      - "${MWX_CONTROL_BIND_HOST:-0.0.0.0}:${MWX_CONTROL_ADVERTISE_PORT:-7946}:${MWX_CONTROL_GOSSIP_PORT:-7946}/tcp"
      - "${MWX_CONTROL_BIND_HOST:-0.0.0.0}:${MWX_CONTROL_ADVERTISE_PORT:-7946}:${MWX_CONTROL_GOSSIP_PORT:-7946}/udp"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
